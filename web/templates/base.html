<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}CineMatch{% endblock %}</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; margin: 0; background: #f4f4f8; color: #1f2937; }
    header { background: #111827; color: #fff; padding: 12px 24px; display: flex; align-items: baseline; gap: 32px; }
    header .brand { font-size: 1.25rem; font-weight: 700; color: #fbbf24; }
    nav a { color: #9ca3af; margin-right: 16px; text-decoration: none; }
    nav a:hover { color: #fff; }
    main { max-width: 920px; margin: 24px auto; padding: 0 16px; }
    h1 { font-size: 1.4rem; } h2 { font-size: 1.15rem; margin-top: 36px; }
    form.selector { margin: 16px 0; }
    select, button { font-size: 1rem; padding: 6px 12px; border-radius: 4px; border: 1px solid #d1d5db; }
    button { background: #2563eb; color: #fff; border: none; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    table { border-collapse: collapse; width: 100%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.12); margin-top: 8px; }
    th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid #e5e7eb; }
    th { background: #eef2ff; }
    td.num, th.num { text-align: right; }
    .muted { color: #6b7280; }
    code { background: #e5e7eb; padding: 1px 5px; border-radius: 3px; }
  </style>
</head>
<body>
<header>
  <span class="brand">&#127916; CineMatch</span>
  <nav>
    <a href="/">Recommendations</a>
    <a href="/reports">Hive reports</a>
  </nav>
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
